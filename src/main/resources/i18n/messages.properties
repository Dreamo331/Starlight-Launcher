page.t0696=This page uses the third-party service SakuraFrp for network tunneling; using it means you accept its terms. This project is not affiliated with SakuraFrp
page.t0697=First time: register on the SakuraFrp panel and create a TCP tunnel, with 127.0.0.1 as the local address and your Minecraft LAN port (25565 by default)
page.t0698=After starting the tunnel, send the connection address to your friends. For a server open to the public, use a multi-line or dedicated game node, otherwise you may break SakuraFrp rules
page.t0699=The access key stays on this device and is never uploaded to any server of this project
