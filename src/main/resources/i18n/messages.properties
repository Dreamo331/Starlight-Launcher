framegen.t0089=Basic · frame blending: the cheapest and runs on any GPU; fast panning shows ghosting.\nStandard · block matching: includes motion estimation for smoother motion; recommended for discrete GPUs.\nNeural (DirectML) is not implemented yet and is explicitly downgraded to the Standard profile, as shown truthfully in the status above.
framegen.t0090=⚠ Prerequisites\n· Minecraft must run in Windowed or Windowed Fullscreen; exclusive fullscreen cannot be captured\n· Interpolation adds about one frame of latency; enable passthrough for competitive play\n· Running alongside Lossless Scaling conflicts — pick one\n· Capture border: hidden automatically on Windows 11; may appear on Windows 10 (normal system behavior)\n· Requires Windows 10 version 1903 or newer (Graphics Capture); older versions are unsupported\n· The launcher and the game must run at the same privilege level (both admin or both standard)
