page.t0552=The Fabric loader ships no API of its own, and most Fabric mods need Fabric API to run — use the FabricAPI row above to pick and install a version separately.
page.t0553=Localized-name search is supported: typing a Chinese mod name is translated to its English name for the query, and results with a known translated name are shown first
page.t0554=Note: world saves come from CurseForge. They are extracted into the saves directory automatically; if the archive contains a single top-level folder, that folder name becomes the save name, otherwise the resource name is used.
page.t0555=Lowers physical memory usage by roughly 1/3, and not only for Minecraft. On a mechanical hard drive this may cause brief stuttering.
page.t0556=Note: public game servers may only use nodes whose name contains "multi-line" or dedicated game nodes; otherwise you may violate SakuraFrp''s rules and get banned.
page.t0557=Modpack detection: modpacks installed by this launcher (the version JSON has inheritsFrom and no mainClass).\nModpacks installed by external launchers such as PCL2 cannot be detected automatically (no marker in the directory) and are still grouped under their underlying loader.
