a11y.t0001=Accessibility
advanced.t0109=Marks Java as high performance in Windows graphics settings so laptops do not run the game on integrated graphics (needs a full Java path)
advanced.t0110=Warms up the game runtime in the background so the first launch is faster; released when the launcher closes
advanced.t0111=How much CPU time the game gets. High eases stutter with large modpacks; Realtime can make mouse and keyboard lag, so avoid it for long sessions. Applies at the next launch
advanced.t0112=What the launcher does once the game window appears: stay, close, hide and close on exit, or minimize. Closing quits the launcher; the game keeps running
advanced.t0113=Remember files that already passed checks so later launches skip them (used when Fast check is off)
advanced.t0114=Click an icon to fill in the address and suggested models, then paste your key to start. The address can be changed at any time
colorblind.t0031=When on, color correction applies to the game window at every launch and stops when the game exits. When off, it stays off after a restart
colorblind.t0032=On: color vision assist starts on by default before you first set the master switch. After that the master switch decides, and turning it off also turns this off
colorblind.t0033=Take a color vision self-test in the browser: pick the digits you see to find your type, then choose the clearest strength. Save configuration applies at the next launch; Restart tool shows the effect right away
colorblind.t0034=Color vision assist needs an external tool that is not bundled. Download correction tool fetches it into your data folder with no manual setup; the settings below stay unavailable until then
dev.t0106=Deletes the download cache and check results under .cache in the game directory.\nGame files are untouched; the next completion fetches fresh data and checks everything again
dev.t0107=Matched sources use a single connection to avoid rate limits. Built in: bmclapi, github.com and others; these cannot be removed
dlsettings.t0048=Starlight is the original engine (default); PCL is a new engine modeled on PCL2. It applies at the next completion
fgen.t0038=Frames actually rendered. Green counts frames submitted for display; anything above the orange refresh-rate line cannot be shown
