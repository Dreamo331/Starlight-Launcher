newui.t0119=· This game run uses GraalVM (JVMCI compiler). The launcher already started it with minimal JVM arguments;
newui.t0120=If crashes keep happening during resource loading without a Java stack trace, switch Java to standard OpenJDK 21/25,
newui.t0121=Launch once more with the same version and directory as a control — the fastest way to separate GraalVM compatibility from a game/launcher problem.\n
newui.t0122=· Exit code 
newui.t0123= indicates the process was terminated by the system at the native layer (
newui.t0124=), so no exception stack trace is left on the Java side. In Event Viewer → Windows Logs → Application, filter by source 
newui.t0125=For Application Error, check the event at the same moment and focus on Faulting module name:
newui.t0126=ntdll.dll points to the system layer, jvm.dll / graal*.dll to the JVM itself, and nvoglv*/ig*icd to the graphics driver.\n
newui.t0127=· No crash-report and no hs_err_pid log were found: the crash likely happened before the JVM logging system initialized,
newui.t0128=or occurred in the launcher / system layer.\n
