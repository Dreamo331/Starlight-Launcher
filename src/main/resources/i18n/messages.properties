page.t0634=Terracotta multiplayer is third-party free and open-source software; report any issues you encounter through its own channels.
page.t0635=Terracotta multiplayer uses P2P: once connected, users in the room talk directly, with no third-party server relaying your traffic. The final experience depends heavily on the network conditions of the participants.
page.t0636=Throughout multiplayer sessions you must strictly comply with all laws and regulations of your country and region.
