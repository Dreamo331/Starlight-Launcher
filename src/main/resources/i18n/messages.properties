page.t0696=This page uses the third-party service SakuraFrp (a NAT traversal service); using it means you accept its terms, and this project is not affiliated with SakuraFrp.
page.t0697=First use: register on the SakuraFrp panel and create a TCP tunnel — set the local address to 127.0.0.1 and the local port to your Minecraft LAN port (25565 by default).
page.t0698=After starting the tunnel, send the connection address to your friends; for a server open to the public you must use a node whose name contains "multi-line" or a dedicated game node, otherwise you may violate SakuraFrp''s rules.
page.t0699=The access key is stored only on this machine (.sakura.dat, obfuscated) and is never uploaded to any server of this project.
page.t0700=If startup fails, check the frpc log below and confirm the tunnel is not blocked, the node is online and the access key is valid.
