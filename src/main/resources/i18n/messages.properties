# ---- 第 2 轮续编号新增（合并相邻字面量后的长句） ----
a11y.t0001=Accessibility
advanced.t0109=Registers the Java process as "high performance" in the Windows graphics settings so laptops do not run the game on integrated graphics (requires a full Java path to take effect)
advanced.t0110=Runs a lightweight JVM in the background once the launcher starts, pulling the runtime and class libraries into the system cache so the first launch is faster; memory is reclaimed when the launcher closes
advanced.t0111=How much CPU time the game process gets. "High" can ease stutter when loading big modpacks; "Realtime" preempts critical system threads and may make the mouse and keyboard stutter, so it is not recommended for long sessions. Applies only at the next launch
advanced.t0112=What the launcher does once the game window appears: stay as is / close immediately / hide and automatically close or reopen when the game exits / minimize. Choosing close immediately or hide-and-auto-close really quits the launcher (the game keeps running); just reopen it when you want it back
advanced.t0113=Remembers files that passed verification and were not modified since, so a second run skips re-hashing them and startup verification gets much faster (only effective when fast verification is off; turning this off means full verification every time)
advanced.t0114=Click a provider icon to fill in the API address and recommended models, then paste your own API key to use it; the address can be edited at any time (relay services and local inference both work)
colorblind.t0031=When on, color-blind correction is enabled for the game window every time you launch the game, and it ends automatically when the game exits (correction does not affect the desktop or other windows). When off, this setting is remembered and will not switch on when the launcher restarts.
colorblind.t0032=When on: on a first run where the master switch has never been set, color-blind assistance defaults to on after the launcher starts; afterwards the master switch is always authoritative. Turning the master switch off by hand also turns this off — the two switches never conflict.
colorblind.t0033=Run a color-vision self-test in the browser: pick the digits you see to infer your deficiency type, then choose the clearest strength; you can also drag the strength or change the type manually. "Save configuration" writes the config file (effective at the next game launch). "Restart correction tool process" restarts the tool with the current values, so the effect is visible immediately while the game window is running (press F10 in the correction tool window to exit it manually).
colorblind.t0034=Color-blind assistance relies on the external correction tool ColorBlindOverlay.exe, which is not bundled with the launcher. Click "Download correction tool" and it is downloaded automatically into the ColorBlindOverlay folder in the user data directory — no manual installation needed; you can also get it from the download page and place it yourself. Until it is installed, the correction settings below are unavailable.
dev.t0106=Deletes the download metadata cache and verification state cache under .cache in the game directory.\nGame files themselves are unaffected; the next resource completion re-fetches metadata and performs a full verification (slower but stricter).
dev.t0107=Download sources whose matched fragments use a single thread (to avoid rate limiting and bot detection); built in: bmclapi / github.com / githubusercontent / modrinth / mcbbs / optifine / meloong / momot / pcl2-server (cannot be removed)
dlsettings.t0048=Starlight = the original engine (default, behaviour unchanged); PCL = a new engine modeled on PCL2 (global single concurrency + connection reuse + geometric chunk splitting + rate-based stall detection). A switch takes effect at the next completion; the slider on the right only applies to the PCL engine.
fgen.t0038=Rendered frame count (not the rate the monitor displays). The green curve is the number of frames we actually generated and submitted for presentation, covering both real and interpolated frames; the orange dashed line is the monitor refresh-rate cap — green above it means the extra rendered frames cannot be shown and are pure waste.
theme.t0049=When on, the top-right of the title bar shows three red/yellow/green dots (minimize / maximize / close); when off they become a minus and a cross (minus = minimize, cross = close).
theme.t0050=A background image is currently set, so the custom background color has no effect (wallpaper takes priority). To use a solid color, first click Restore default under Background image above.

a11y.t0014=Enables color-blind correction for the game window while playing (it stops automatically when the game exits). Turning it off is remembered, so restarting the launcher will not turn it back on. Adjust type / strength / window title via Detailed settings on the right.

