# ============================================================
#  UI strings · English translation (fallback bundle)
#
#  Keys: <domain>.tNNNN plain / pNNNN parameterised / kNNNN prefix /
#        rNNNN result message. Call site in code: I18N.get("<key>").
#  Arguments: MessageFormat placeholders {0} {1}; quote apostrophes as ''.
#
#  Style (read before editing):
#   · Describe what the user is doing; no implementation details, internal
#     file names or status codes in user-facing text.
#   · One sentence per idea, state the consequence and the next step.
#   · One verb per action: delete / remove / clear / save / cancel.
#   · No exclamation marks and no filler words.
#   · Keep licence and copyright notices (license.*, about.copyright) verbatim.
# ============================================================

