# ---- 第 2 轮续编号新增（合并相邻字面量后的长句） ----
a11y.t0001=辅助功能
advanced.t0109=在 Windows 显卡设置中把 Java 进程登记为「高性能」，避免笔记本用核显跑游戏（需要 Java 路径为完整路径才生效）
advanced.t0110=启动器启动后在后台跑一次轻量 JVM，把运行时与类库读进系统缓存，让游戏首次启动更快；关闭启动器即回收
advanced.t0111=给游戏进程分配更多（或更少）的 CPU 时间。切到「高」可缓解大型整合包加载卡顿；「实时」会抢占系统关键线程，可能让鼠标键盘卡顿，不建议长期使用。仅下次启动游戏时应用
advanced.t0112=游戏窗口出现后启动器怎么处理：保持不变 / 立即关闭 / 隐藏并在游戏退出后自动关闭或重新打开 / 最小化。选「立即关闭」或「隐藏后自动关闭」时启动器会真的退出（游戏继续运行不受影响），想再看启动器的话重新打开即可
advanced.t0113=记住上次校验通过且之后未被修改的文件，二次补全不再重复计算哈希，可大幅加快启动校验（仅在「快速校验」关闭时生效；关闭本项则每次都完整校验）
advanced.t0114=点图标自动填入 API 地址与推荐模型，再贴自己的 API Key 就能用；地址随时可以手动改（中转站、本地推理服务都行）
colorblind.t0031=开启后，每次启动游戏都会自动对游戏窗口启用色盲矫正；游戏退出后矫正自动结束（矫正工具不作用于桌面等其它窗口）。关闭后本设置会被记住，重启启动器不会自动打开
colorblind.t0032=开启时：尚未设置过总开关的首次运行，启动器启动后色盲辅助默认开启；之后一律以总开关为准。手动关闭总开关会自动关闭本项，两个开关不会互相打架
colorblind.t0033=在网页里做色觉自测小游戏：看图选数字即可推断色障类型、再挑出最清楚的强度档；也可以手动拖动强度 / 换类型。点「保存配置」写入配置文件（下次启动游戏生效）；点「重启矫正工具进程」按当前数值立即重启矫正工具，游戏窗口在运行时马上能看到效果（矫正工具窗口内按 F10 可手动退出）
colorblind.t0034=色盲辅助依赖外部矫正工具 ColorBlindOverlay.exe（不随启动器分发）。点「下载矫正工具」会自动下载并放到用户数据目录的 ColorBlindOverlay 文件夹，无需手动安装；也可以到下载页手动获取后自行放置。安装完成前，下方矫正设置不可用
dev.t0106=将删除游戏目录 .cache 下的下载元数据缓存与校验状态缓存。\n不影响游戏文件本身，下次资源补全会重新拉取元数据并做完整校验（更慢但更严格）。
dev.t0107=命中片段的下载源只开一个线程（防风控/限流）；内置: bmclapi / github.com / githubusercontent / modrinth / mcbbs / optifine / meloong / momot / pcl2-server（不可移除）
dlsettings.t0048=Starlight = 原引擎（默认，行为不变）；PCL = 对标 PCL2 的新引擎（全局单一并发 + 连接复用 + 几何分裂分块 + 速率型停滞判定）。切换后下一次补全生效，右侧滑块仅在 PCL 引擎下生效。
fgen.t0038=渲染帧数（不是显示器显示帧数）。绿色曲线是我们实际生成并提交呈现的帧数，包含真实帧与插值帧；橙色虚线是显示器刷新率上限——绿色高于虚线说明多渲染的帧屏幕吃不下，属于纯浪费。
