page.t0553=支持中文名搜索：输入「机械动力」会自动翻译为 Create 去检索，并优先展示收录了中文名的结果
page.t0554=说明：世界存档来自 CurseForge。下载后会自动解压到存档目录（saves）；若压缩包内含单一顶层文件夹，则以该文件夹名作为存档名，否则以资源名命名。
