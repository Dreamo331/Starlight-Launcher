framegen.t0089=基础 · 帧混合：最省算力，任何显卡可跑；快速平移会有拖影。\n标准 · 块匹配：带运动估计，画面更连贯；独显推荐。\n神经（DirectML）尚未实现，会被明确降级为标准档并在上方状态里如实显示。
framegen.t0090=⚠ 使用前提\n· Minecraft 必须使用「窗口化」或「窗口化全屏」，独占全屏无法捕获\n· 插值会引入约 1 帧额外延迟，竞技场景建议开启直通\n· 与 Lossless Scaling 同时运行会冲突，请二选一\n· 捕获黄框：Windows 11 已自动隐藏；Windows 10 可能显示，属系统行为\n· 系统需 Windows 10 1903 及以上（Graphics Capture），更低版本不支持\n· 启动器与游戏必须处于同一权限层级（同为管理员或同为普通用户）
